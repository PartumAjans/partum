<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Güvenli Alışveriş — Eda Erateşli</title>
  <style>
    :root {
      --bg: #f6f4f1;
      --card-bg: #ffffff;
      --border: #ececec;
      --title: #1a1a1a;
      --muted: #8a8a8a;
      --icon: #2b2b2b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--title);
      -webkit-font-smoothing: antialiased;
    }

    .trust-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .trust-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 34px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Alttaki kart tam genişlik kaplasın */
    .trust-card--wide {
      grid-column: 1 / -1;
    }

    .trust-icon {
      color: var(--icon);
      line-height: 0;
    }

    .trust-icon svg {
      width: 44px;
      height: 44px;
    }

    .trust-card h3 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--title);
    }

    .trust-card p {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 340px;
    }

    /* Mobil */
    @media (max-width: 600px) {
      .trust-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .trust-section {
        padding: 28px 16px;
      }
      .trust-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <section class="trust-section" aria-label="Güvenli alışveriş bilgileri">
    <div class="trust-grid">

      <!-- 256 Bit SSL -->
      <div class="trust-card">
        <span class="trust-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5l-8-3Z" />
            <rect x="9" y="11" width="6" height="5" rx="1" />
            <path d="M10 11V9.5a2 2 0 0 1 4 0V11" />
          </svg>
        </span>
        <h3>256 Bit SSL Güvenli Ödeme</h3>
        <p>Alışverişleriniz şifreli ve korumalıdır.</p>
      </div>

      <!-- 3D Secure -->
      <div class="trust-card">
        <span class="trust-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
            <line x1="2.5" y1="9.5" x2="21.5" y2="9.5" />
            <line x1="6" y1="14.5" x2="12" y2="14.5" />
          </svg>
        </span>
        <h3>3D Secure Koruması</h3>
        <p>Kart bilgileriniz saklanmaz.</p>
      </div>

      <!-- %100 Güvenli Alışveriş -->
      <div class="trust-card trust-card--wide">
        <span class="trust-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.5c1 1.1 2.4 1.7 3.9 1.6 .3 1.5 1.2 2.7 2.5 3.4-.6 1.4-.6 3 0 4.4-1.3.7-2.2 1.9-2.5 3.4-1.5-.1-2.9.5-3.9 1.6-1-1.1-2.4-1.7-3.9-1.6-.3-1.5-1.2-2.7-2.5-3.4 .6-1.4 .6-3 0-4.4 1.3-.7 2.2-1.9 2.5-3.4C9.6 4.2 11 3.6 12 2.5Z" />
            <path d="m9.2 11.8 1.9 1.9 3.7-3.7" />
          </svg>
        </span>
        <h3>%100 Güvenli Alışveriş</h3>
        <p>Güvenli ödeme altyapısı ve resmi faturalı satış garantisi.</p>
      </div>

    </div>
  </section>
</body>
</html>
